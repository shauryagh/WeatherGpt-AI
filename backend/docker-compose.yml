version: "3.9"
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: weathergpt
      POSTGRES_PASSWORD: weathergpt
      POSTGRES_DB: weathergpt
    ports:
      - "5432:5432"
    volumes:
      - weathergpt_pgdata:/var/lib/postgresql/data

  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  weathergpt_pgdata:
